[flake8]
max-line-length = 120
max-complexity = 15
exclude = */migrations/*,.eggs/*

[isort]
combine_as_imports = True
force_grid_wrap = 4
float_to_top = True
include_trailing_comma = True
known_first_party = microcosm_logging
extra_standard_library = pkg_resources
line_length = 99
lines_after_imports = 2
multi_line_output = 3
skip = __init__.py

[mypy]
ignore_missing_imports = True

[tool:pytest]
addopts =
    --cov microcosm_logging
    --cov-report xml:microcosm_logging/tests/coverage/cov.xml
    --junitxml=microcosm_logging/tests/test-results/pytest/junit.xml

[coverage:report]
show_missing = True
